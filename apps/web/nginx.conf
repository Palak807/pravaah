server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Register photos (base64 data URLs for up to 3 images) can exceed nginx's 1 MB
  # default; without this, uploads 413 and the OCR silently falls back to sample data.
  client_max_body_size 30m;

  # gzip static assets
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Reverse-proxy the API so the browser talks to a single origin (no CORS).
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
